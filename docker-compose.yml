# Local dependencies for the bidding engine. Credentials are dev-only.
# Host ports can be moved with REDIS_PORT, POSTGRES_PORT and KAFKA_PORT.
services:
  redis:
    image: redis:8-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    # Live auction state must survive a restart: fsync the AOF every second.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]

  postgres:
    image: postgres:17-alpine
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    environment:
      POSTGRES_USER: auctions
      POSTGRES_PASSWORD: auctions
      POSTGRES_DB: auctions
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "auctions"]
      interval: 2s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    ports: ["${KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list"]
      interval: 3s
      retries: 40

  kafka-topics:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in auctions.v1.bid-placed auctions.v1.bid-placed-dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic "$$topic" --partitions 6 --replication-factor 1
        done
